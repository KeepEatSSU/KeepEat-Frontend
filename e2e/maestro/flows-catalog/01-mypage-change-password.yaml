# 카탈로그 01 — 비밀번호 변경 화면 + validation 실패 상태 캡처.
# 검증 목적 아님(assert 없음) — 화면 도달 대기(extendedWaitUntil)만 쓴다.
# 제출하지 않는다: 조건 미달 입력이라 제출 버튼 자체가 disabled 다.
appId: com.anonymous.keepeat_front.demo
---
- launchApp
- runFlow: ../common/ensure-logged-in.yaml
- tapOn:
    text: "마이"
- extendedWaitUntil:
    visible:
      text: "비밀번호 변경"
    timeout: 10000
- tapOn:
    text: "비밀번호 변경"
- extendedWaitUntil:
    visible:
      id: "change-password.new.input"
    timeout: 10000
# 캡처: 비밀번호 변경 (초기 상태)
- takeScreenshot: ${SCREENSHOT_DIR}/change-password
# 조건 미달 새 비밀번호("abc") → 체크리스트 미충족 + 확인 불일치("abcd") →
# 빨간 인라인 에러. 현재 비밀번호는 건드리지 않는다(실제 값 불필요).
- tapOn:
    id: "change-password.new.input"
- inputText: "abc"
- tapOn:
    id: "change-password.confirm.input"
- inputText: "abcd"
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: "새 비밀번호가 일치하지 않아요"
    timeout: 5000
# 캡처: validation 실패 상태 (체크리스트 미충족 + 불일치 에러)
- takeScreenshot: ${SCREENSHOT_DIR}/change-password-validation
# 제출 없이 뒤로 → 마이페이지 복귀 (change-password 는 뒤로가기 가로채기 없음)
- back
- extendedWaitUntil:
    visible:
      text: "마이페이지"
    timeout: 10000
