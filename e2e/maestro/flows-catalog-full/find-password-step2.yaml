# 카탈로그(full 전용) — 비밀번호 찾기 2단계(인증번호 입력 화면) 캡처.
#
# ⚠️ 이 flow 는 유효 이메일로 인증번호 발송을 실제 제출한다:
#   - TEST_EMAIL 로 실제 인증 메일이 1통 발송된다.
#   - 이메일당 발송 rate limit(3회/15분)을 1회 소모한다.
# 그래서 기본 --catalog 에서 제외되고 --catalog-full 에서만 실행된다.
# 인증번호는 입력하지 않으므로 계정 상태는 바뀌지 않는다 (코드는 미사용
# 상태로 만료된다).
#
# 로그아웃 상태가 필요해 clearState 로 시작하고, 끝에 재로그인해 기기를
# 로그인 상태로 되돌린다.
appId: com.anonymous.keepeat_front.demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login.email.input"
    timeout: 20000
- tapOn:
    id: "login.find-password-link"
- extendedWaitUntil:
    visible:
      id: "find-password.email.input"
    timeout: 10000
- tapOn:
    id: "find-password.email.input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
# 유효 이메일 제출 → 2단계 진입 (rate limit 1회 소모 지점)
- tapOn:
    id: "find-password.submit-button"
- extendedWaitUntil:
    visible:
      text: "인증번호"
    timeout: 15000
# 캡처: 비밀번호 찾기 2단계 (인증번호 입력)
- takeScreenshot: ${SCREENSHOT_DIR}/find-password-step2
# 인증번호는 입력하지 않고 단계 후퇴 → 로그인 화면
- tapOn:
    id: "find-password.back-button"
- tapOn:
    id: "find-password.back-button"
- extendedWaitUntil:
    visible:
      id: "login.email.input"
    timeout: 10000
# 재로그인해 기기를 로그인 상태로 복구
- tapOn:
    id: "login.email.input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login.password.input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login.submit-button"
- extendedWaitUntil:
    visible:
      text: "마이"
    timeout: 20000
