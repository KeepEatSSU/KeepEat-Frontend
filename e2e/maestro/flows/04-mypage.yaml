# 04 — 마이페이지: 닉네임/이메일 표시 확인
appId: com.anonymous.keepeat_front.demo
---
- launchApp
- runFlow: ../common/ensure-logged-in.yaml
- tapOn:
    text: "마이"
- extendedWaitUntil:
    visible:
      text: "마이페이지"
    timeout: 10000
- assertVisible:
    id: "mypage.nickname.text"
- assertVisible:
    id: "mypage.email.text"
# 이메일 가입 테스트 계정이므로 로그인에 쓴 이메일이 그대로 표시되어야 한다
- assertVisible:
    text: ${TEST_EMAIL}
# 카탈로그: 마이페이지
- takeScreenshot: ${SCREENSHOT_DIR}/mypage
