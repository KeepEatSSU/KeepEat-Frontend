# 05 — 푸시 알림 수신 스위치: 반대로 토글 → 원상복구까지가 한 flow.
# PATCH /api/users/me/notification-setting 은 명시적 값을 보내는 멱등 API라서
# 두 번 토글하면 서버 상태가 원래대로 돌아온다.
# 초기 상태(켜짐/꺼짐)는 서버 값이라 알 수 없으므로 checked 상태로 분기한다.
appId: com.anonymous.keepeat_front.demo
---
- launchApp
- runFlow: ../common/ensure-logged-in.yaml
- tapOn:
    text: "마이"
- extendedWaitUntil:
    visible:
      id: "mypage.notification-toggle.switch"
    timeout: 10000
# 켜짐 → 끄고 → 다시 켜서 복구
- runFlow:
    when:
      visible:
        id: "mypage.notification-toggle.switch"
        checked: true
    commands:
      - tapOn:
          id: "mypage.notification-toggle.switch"
      - extendedWaitUntil:
          visible:
            id: "mypage.notification-toggle.switch"
            checked: false
          timeout: 10000
      - tapOn:
          id: "mypage.notification-toggle.switch"
      - extendedWaitUntil:
          visible:
            id: "mypage.notification-toggle.switch"
            checked: true
          timeout: 10000
# 꺼짐 → 켜고 → 다시 꺼서 복구
- runFlow:
    when:
      visible:
        id: "mypage.notification-toggle.switch"
        checked: false
    commands:
      - tapOn:
          id: "mypage.notification-toggle.switch"
      - extendedWaitUntil:
          visible:
            id: "mypage.notification-toggle.switch"
            checked: true
          timeout: 10000
      - tapOn:
          id: "mypage.notification-toggle.switch"
      - extendedWaitUntil:
          visible:
            id: "mypage.notification-toggle.switch"
            checked: false
          timeout: 10000
# 토글 실패 시 표시되는 토스트가 없어야 한다
- assertNotVisible:
    text: "알림 설정 변경에 실패했어요"
