# 03 — 알림함: 열기 → 목록 표시 → 닫기
# 읽음 처리 tap 은 하지 않는다 (서버 상태 변형 방지).
appId: com.anonymous.keepeat_front.demo
---
- launchApp
- runFlow: ../common/ensure-logged-in.yaml
- tapOn:
    text: "냉장고"
- extendedWaitUntil:
    notVisible:
      text: "냉장고 문을 여는 중..."
    timeout: 20000
# 헤더 벨 아이콘 (accessibilityLabel 은 미읽음 개수에 따라 변하므로 testID 사용)
- tapOn:
    id: "header.notification-bell"
- extendedWaitUntil:
    visible:
      id: "notification-popup.root"
    timeout: 10000
- assertVisible:
    text: "알림"
# 알림 목록 자체는 서버 데이터에 따라 비어 있을 수 있으므로
# 팝업 헤더까지만 검증하고 개별 알림은 tap 하지 않는다 (읽음 처리 방지).
# 닫기 → 홈 복귀
- tapOn:
    id: "notification-popup.close-button"
- extendedWaitUntil:
    notVisible:
      id: "notification-popup.root"
    timeout: 10000
- assertVisible:
    text: "냉장고"
