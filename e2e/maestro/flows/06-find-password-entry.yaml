# 06 — 비밀번호 찾기 진입: 로그아웃 상태가 필요하므로 이 flow만
# 앱 데이터 클리어 후 시작한다.
# 잘못된 형식의 이메일 → 인라인 에러 확인 → 유효 이메일은 제출하지 않고
# 뒤로 → 다시 로그인까지.
# 주의: 에뮬레이터에서 autofill 을 꺼두어야 한다 (README 사전 준비 4번).
# 켜져 있으면 마지막 로그인 직후 Google Password Manager 저장 다이얼로그가
# 화면을 덮어 홈 도달 assert 가 실패한다.
# 주의: 미가입 이메일도 서버는 성공 응답을 준다(계정 열거 방지).
# 따라서 결정적으로 검증 가능한 에러는 클라이언트 형식 검증뿐이다.
# 유효한 이메일 제출은 실제 인증 메일을 발송하므로 하지 않는다.
appId: com.anonymous.keepeat_front.demo
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login.email.input"
    timeout: 20000
# 비밀번호 찾기 진입
- tapOn:
    id: "login.find-password-link"
- extendedWaitUntil:
    visible:
      id: "find-password.email.input"
    timeout: 10000
- assertVisible:
    text: "가입한 이메일로 인증번호를 보내드려요"
# 카탈로그: 비밀번호 찾기 1단계 (입력 전 초기 상태)
- takeScreenshot: ${SCREENSHOT_DIR}/find-password-step1
# 잘못된 형식의 이메일 → 인라인 에러 (제출 버튼은 disabled 상태 유지)
- tapOn:
    id: "find-password.email.input"
- inputText: "not-an-email"
- assertVisible:
    text: "이메일 형식을 확인해주세요"
- hideKeyboard
# 카탈로그: 이메일 형식 인라인 에러 상태
- takeScreenshot: ${SCREENSHOT_DIR}/find-password-email-error
# 제출하지 않고 뒤로 → 로그인 화면 복귀
- tapOn:
    id: "find-password.back-button"
- extendedWaitUntil:
    visible:
      id: "login.email.input"
    timeout: 10000
# 다시 로그인
- tapOn:
    id: "login.email.input"
- inputText: ${TEST_EMAIL}
- hideKeyboard
- tapOn:
    id: "login.password.input"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login.submit-button"
- extendedWaitUntil:
    visible:
      text: "마이"
    timeout: 20000
