# 02 — 홈(냉장고): 재료 목록이 표시되는지 확인
# 독립 실행 가능: 세션이 없으면 ensure-logged-in 이 로그인부터 수행한다.
appId: com.anonymous.keepeat_front.demo
---
- launchApp
- runFlow: ../common/ensure-logged-in.yaml
- tapOn:
    text: "냉장고"
# 로딩이 끝날 때까지 대기
- extendedWaitUntil:
    notVisible:
      text: "냉장고 문을 여는 중..."
    timeout: 20000
# 테스트 계정에는 식재료가 있어야 한다 (빈 계정이면 home.empty-state 가 뜬다)
- assertVisible:
    id: "home.ingredient-list"
# 카탈로그: 홈(냉장고) — 재료 목록 로딩 완료 상태
- takeScreenshot: ${SCREENSHOT_DIR}/home
