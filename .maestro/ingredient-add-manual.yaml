    text: "꽃등심"
    optional: true
- assertVisible:
    text: "수량을 입력해주세요"
- assertVisible:
    text: "보관 방법을 선택해주세요"
- tapOn:
    text: "1개 늘리기"
    optional: true
- tapOn:
    text: "냉장"
- assertVisible:
