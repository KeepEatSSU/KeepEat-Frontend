appId: com.anonymous.keepeatfront
env:
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}
---
- launchApp:
    clearState: true
- assertVisible:
    text: "로그인"
- tapOn:
    text: "이메일"
- inputText: ${TEST_EMAIL}
- tapOn:
    text: "비밀번호"
- inputText: ${TEST_PASSWORD}
- tapOn:
    text: "로그인"
- assertVisible:
    id: "tab.fab.add-button"
    optional: true
- assertVisible:
    text: "냉장고"
    optional: true
